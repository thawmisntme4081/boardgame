# Litestream: copies the SQLite database to S3-compatible storage (Cloudflare R2) as it changes.
# Every value comes from the environment (Fly secrets); see docs/reference/sharing-and-deployment.md.
dbs:
  - path: ${DATA_DIR}/boardgames.sqlite
    replicas:
      - type: s3
        url: ${LITESTREAM_REPLICA_URL} # s3://boardgames-backup/main
        endpoint: ${LITESTREAM_ENDPOINT} # https://<account id>.r2.cloudflarestorage.com
        region: auto
        force-path-style: true
        access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
        secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
        # Keep 7 days of history to restore from.
        retention: 168h
