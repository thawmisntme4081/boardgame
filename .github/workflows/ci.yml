name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck, lint, unit + integration tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: Playwright (Desktop Chrome, iPhone 13, Pixel 7) + Lighthouse (mobile)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      # Builds the app and starts the production server itself (see playwright.config.ts).
      - run: pnpm e2e
      # Mobile Lighthouse audit of the build e2e just made (see lighthouserc.cjs).
      - run: pnpm lighthouse
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 7

  # Deploys main to Fly.io once every check and Playwright pass. Off until the repository
  # variable FLY_DEPLOY is "true" and the secret FLY_API_TOKEN exists (see
  # docs/reference/sharing-and-deployment.md). A deploy restarts the one machine for a few
  # seconds: players reconnect and nothing is lost.
  deploy:
    name: Deploy to Fly.io
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.FLY_DEPLOY == 'true'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --ha=false --build-arg VITE_SENTRY_DSN="${{ vars.VITE_SENTRY_DSN }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
